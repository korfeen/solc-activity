<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>SOLC Puzzle</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <main id="app">
      <div class="toggles">
        <button id="ogre-toggle" type="button" aria-pressed="false" title="Ogre mode: ogre words and crayon letters">OGRE</button>
        <button id="mute" type="button" aria-pressed="false" aria-label="Sound on" title="Sound">🔊</button>
      </div>
      <header class="sign">
        <h1>Sleepy Ogre Leisure Club</h1>
        <p class="sub" data-crayon data-ogre="SMASH PUZZL">Puzzle races</p>
      </header>
      <p id="status" class="status">Waking the ogre…</p>
      <section class="puzzle" aria-labelledby="puzzle-title">
        <section class="players" aria-labelledby="players-title">
          <h2 id="players-title" data-crayon data-ogre="CAVE">In the cave</h2>
          <ul id="players"></ul>
        </section>
        <div class="board-col">
          <div class="board-wrap">
            <canvas id="board" aria-label="Puzzle board"></canvas>
            <div id="countdown" class="countdown" hidden></div>
          </div>
          <div id="rivals" class="rivals" aria-label="Everyone's boards"></div>
        </div>
        <div class="puzzle-info">
          <div class="race-box">
            <button id="race" type="button" class="primary" data-crayon data-ogre="SMASH RACE" disabled>Race everyone</button>
            <p id="race-status" class="race-status">Connecting to the room…</p>
          </div>
          <h2 id="puzzle-title" data-crayon>Practice</h2>
          <div class="choices" role="group" aria-label="Mode">
            <button type="button" data-mode="swap" aria-pressed="true" data-crayon data-ogre="SWAP">Swap</button>
            <button type="button" data-mode="sliding" aria-pressed="false" data-crayon data-ogre="SLIDE">Sliding</button>
          </div>
          <div class="choices" role="group" aria-label="Size">
            <button type="button" data-size="3" aria-pressed="false">3×3</button>
            <button type="button" data-size="4" aria-pressed="true">4×4</button>
            <button type="button" data-size="5" aria-pressed="false">5×5</button>
          </div>
          <div class="clock">
            <span id="time">0.0</span>
            <span id="moves">0 moves</span>
          </div>
          <p id="result" class="result"></p>
          <div class="actions">
            <button id="start" type="button" class="primary" data-crayon>Start</button>
            <button id="new-picture" type="button" data-crayon data-ogre="NEW PIX">New picture</button>
          </div>
          <p id="hint" class="hint"></p>
          <details class="about">
            <summary><span id="picture-rarity" class="rarity"></span> <span data-ogre="PIX">picture</span></summary>
            <ul id="traits" class="traits"></ul>
            <p id="seed" class="seed"></p>
          </details>
        </div>
      </section>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
